<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Voice Note Pro</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #0f172a;
            color: #f8fafc;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            min-height: 100vh;
        }

        /* Header App */
        .app-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding-bottom: 12px;
            border-bottom: 1px solid #334155;
        }

        .app-title {
            font-size: 1.25rem;
            font-weight: 700;
            color: #38bdf8;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* Card Container */
        .card {
            background: rgba(30, 41, 59, 0.7);
            border: 1px solid #334155;
            border-radius: 16px;
            padding: 16px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
        }

        /* Record Visualizer & Status */
        .record-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            gap: 16px;
            padding: 24px 12px;
        }

        .mic-btn {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: #0284c7;
            border: none;
            color: white;
            font-size: 32px;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(2, 132, 199, 0.5);
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .mic-btn.recording {
            background: #ef4444;
            box-shadow: 0 0 25px rgba(239, 68, 68, 0.8);
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.08); }
            100% { transform: scale(1); }
        }

        .status-text {
            font-size: 0.9rem;
            color: #94a3b8;
        }

        /* Action Buttons Grid */
        .btn-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 10px;
        }

        .btn {
            padding: 12px;
            border-radius: 10px;
            border: none;
            font-weight: 600;
            font-size: 0.85rem;
            cursor: pointer;
            transition: opacity 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .btn-primary { background: #38bdf8; color: #0f172a; }
        .btn-purple { background: #a855f7; color: white; }
        .btn-green { background: #22c55e; color: white; }
        .btn-danger { background: #f43f5e; color: white; }

        /* Text Area */
        .section-title {
            font-size: 0.9rem;
            font-weight: 600;
            color: #cbd5e1;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
        }

        textarea {
            width: 100%;
            height: 140px;
            background: #090d16;
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 12px;
            color: #f1f5f9;
            font-size: 0.9rem;
            resize: none;
            outline: none;
        }

        textarea:focus {
            border-color: #38bdf8;
        }

        /* History List */
        .history-item {
            background: #090d16;
            border: 1px solid #1e293b;
            padding: 12px;
            border-radius: 10px;
            margin-bottom: 10px;
            font-size: 0.85rem;
        }

        .history-date {
            font-size: 0.75rem;
            color: #38bdf8;
            margin-bottom: 4px;
        }

        .history-text {
            color: #cbd5e1;
            white-space: pre-wrap;
        }
    </style>
</head>
<body>

    <!-- Header App -->
    <div class="app-header">
        <div class="app-title">
            <span>🎙️</span> VoiceAI Pro
        </div>
        <span style="font-size: 0.75rem; color: #64748b;">Smart Voice Note</span>
    </div>

    <!-- Perekam Suara -->
    <div class="card record-section">
        <button id="btnRecord" class="mic-btn">🎙️</button>
        <div>
            <h3 id="statusTitle" style="font-size: 1.1rem; font-weight: 600;">Ketuk Mikrofon</h3>
            <p id="statusDesc" class="status-text">Mulailah berbicara untuk merekam suara menjadi teks</p>
        </div>
    </div>

    <!-- Teks Hasil Transkripsi -->
    <div class="card">
        <div class="section-title">
            <span>📝 Transkripsi Suara</span>
            <span id="charCount" style="color: #64748b;">0 Karakter</span>
        </div>
        <textarea id="rawText" placeholder="Suara Anda akan langsung berubah menjadi teks di sini..."></textarea>
    </div>

    <!-- AI Helper Tools -->
    <div class="card">
        <div class="section-title">✨ Fitur AI Assistant</div>
        <div class="btn-grid">
            <button id="btnClean" class="btn btn-purple" disabled>🪄 Rapikan Teks</button>
            <button id="btnSummarize" class="btn btn-primary" disabled>📋 Rangkum AI</button>
        </div>
        <button id="btnSave" class="btn btn-green" style="width: 100%; margin-top: 10px;" disabled>💾 Simpan ke Riwayat</button>
    </div>

    <!-- Hasil Pengolahan AI -->
    <div class="card">
        <div class="section-title">🤖 Hasil AI / Rangkuman</div>
        <textarea id="aiResult" placeholder="Hasil teks yang dirapikan atau dirangkum akan muncul di sini..."></textarea>
    </div>

    <!-- Riwayat Catatan -->
    <div class="card">
        <div class="section-title">
            <span>📜 Riwayat Catatan</span>
            <span onclick="clearHistory()" style="color: #f43f5e; cursor: pointer; font-size: 0.8rem;">Hapus Semua</span>
        </div>
        <div id="historyList" style="max-height: 200px; overflow-y: auto; margin-top: 8px;">
            <p style="text-align: center; color: #64748b; font-size: 0.85rem; padding: 10px;">Belum ada riwayat tersimpan.</p>
        </div>
    </div>

    <script>
        // Cek Dukungan Browser untuk Perekaman Suara Gratis
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        let recognition;
        let isRecording = false;
        let historyData = JSON.parse(localStorage.getItem('my_voice_history') || '[]');

        const btnRecord = document.getElementById('btnRecord');
        const statusTitle = document.getElementById('statusTitle');
        const statusDesc = document.getElementById('statusDesc');
        const rawText = document.getElementById('rawText');
        const aiResult = document.getElementById('aiResult');
        const charCount = document.getElementById('charCount');
        const btnClean = document.getElementById('btnClean');
        const btnSummarize = document.getElementById('btnSummarize');
        const btnSave = document.getElementById('btnSave');
        const historyList = document.getElementById('historyList');

        renderHistory();

        if (SpeechRecognition) {
            recognition = new SpeechRecognition();
            recognition.continuous = true;
            recognition.interimResults = true;
            recognition.lang = 'id-ID'; // Bahasa Indonesia

            recognition.onresult = (event) => {
                let currentTranscript = '';
                for (let i = event.resultIndex; i < event.results.length; i++) {
                    currentTranscript += event.results[i][0].transcript;
                }
                rawText.value = currentTranscript;
                updateState();
            };

            recognition.onerror = (event) => {
                statusTitle.innerText = "Terjadi Kesalahan";
                statusDesc.innerText = "Gagal merekam: " + event.error;
                stopRecordingState();
            };

            recognition.onend = () => {
                if (isRecording) recognition.start(); // Auto start jika masih mode merekam
            };
        } else {
            alert("Browser Anda tidak mendukung pengenal suara langsung. Gunakan Google Chrome versi terbaru.");
        }

        // Toggle Merekam
        btnRecord.addEventListener('click', () => {
            if (!recognition) return;

            if (!isRecording) {
                recognition.start();
                isRecording = true;
                btnRecord.classList.add('recording');
                btnRecord.innerText = '⏹️';
                statusTitle.innerText = "Merekam Suara...";
                statusDesc.innerText = "Bicaralah dengan jelas. Ketuk tombol untuk berhenti.";
            } else {
                stopRecordingState();
            }
        });

        function stopRecordingState() {
            isRecording = false;
            recognition.stop();
            btnRecord.classList.remove('recording');
            btnRecord.innerText = '🎙️';
            statusTitle.innerText = "Selesai Merekam";
            statusDesc.innerText = "Suara berhasil dikonversi ke teks!";
        }

        function updateState() {
            const len = rawText.value.length;
            charCount.innerText = `${len} Karakter`;
            btnClean.disabled = len === 0;
            btnSummarize.disabled = len === 0;
            btnSave.disabled = len === 0;
        }

        rawText.addEventListener('input', updateState);

        // AI Fitur: Merapikan Teks (Klien-side Engine)
        btnClean.addEventListener('click', () => {
            let text = rawText.value;
            // Menghapus kata jeda umum (filler words)
            text = text.replace(/\b(eee|eee|anu|mmm|umpamanya|apanya)\b/gi, '');
            // Merapikan spasi berlebih
            text = text.replace(/\s+/g, ' ').trim();
            // Kapital huruf pertama kalimat
            text = text.replace(/(^\w|\.\s+\w)/g, letter => letter.toUpperCase());
            
            aiResult.value = "[Hasil AI - Teks Dirapikan]:\n" + text;
        });

        // AI Fitur: Merangkum Teks
        btnSummarize.addEventListener('click', () => {
            const text = rawText.value.trim();
            const sentences = text.split(/[.!?]+/).filter(s => s.trim().length > 0);
            
            let summary = "[Hasil AI - Rangkuman Poin Utama]:\n";
            if (sentences.length <= 2) {
                summary += "• " + text;
            } else {
                // Mengambil kalimat awal dan akhir sebagai rangkuman inti
                summary += "• " + sentences[0].trim() + ".\n";
                summary += "• " + sentences[Math.floor(sentences.length / 2)].trim() + ".\n";
                summary += "• " + sentences[sentences.length - 1].trim() + ".";
            }
            aiResult.value = summary;
        });

        // Simpan ke Riwayat HP (Local Storage)
        btnSave.addEventListener('click', () => {
            const item = {
                id: Date.now(),
                date: new Date().toLocaleString('id-ID'),
                raw: rawText.value,
                ai: aiResult.value
            };

            historyData.unshift(item);
            localStorage.setItem('my_voice_history', JSON.stringify(historyData));
            renderHistory();
            alert("Catatan berhasil disimpan ke riwayat!");
        });

        function renderHistory() {
            if (historyData.length === 0) {
                historyList.innerHTML = '<p style="text-align: center; color: #64748b; font-size: 0.85rem; padding: 10px;">Belum ada riwayat tersimpan.</p>';
                return;
            }

            historyList.innerHTML = historyData.map(item => `
                <div class="history-item">
                    <div class="history-date">📅 ${item.date}</div>
                    <div class="history-text"><strong>Suara:</strong> ${item.raw}</div>
                    ${item.ai ? `<div class="history-text" style="color:#a855f7; margin-top:4px;"><strong>AI:</strong> ${item.ai}</div>` : ''}
                </div>
            `).join('');
        }

        function clearHistory() {
            if (confirm("Apakah Anda yakin ingin menghapus seluruh riwayat?")) {
                historyData = [];
                localStorage.removeItem('my_voice_history');
                renderHistory();
            }
        }
    </script>
</body>
</html>
