<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VoiceAI Pro</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: #0f172a;
            color: #f8fafc;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            min-height: 100vh;
        }

        .app-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding-bottom: 12px;
            border-bottom: 1px solid #334155;
        }

        .app-title {
            font-size: 1.2rem;
            font-weight: 700;
            color: #38bdf8;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .card {
            background: rgba(30, 41, 59, 0.8);
            border: 1px solid #334155;
            border-radius: 16px;
            padding: 16px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
        }

        .record-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            gap: 14px;
            padding: 20px 10px;
        }

        .mic-btn {
            width: 76px;
            height: 76px;
            border-radius: 50%;
            background: #0284c7;
            border: none;
            color: white;
            font-size: 30px;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(2, 132, 199, 0.5);
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .mic-btn.recording {
            background: #ef4444;
            box-shadow: 0 0 25px rgba(239, 68, 68, 0.8);
            animation: pulse 1.2s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.08); }
            100% { transform: scale(1); }
        }

        .btn-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 10px;
        }

        .btn {
            padding: 12px;
            border-radius: 10px;
            border: none;
            font-weight: 600;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .btn:disabled {
            opacity: 0.35;
            cursor: not-allowed;
        }

        .btn-primary { background: #38bdf8; color: #0f172a; }
        .btn-purple { background: #a855f7; color: white; }
        .btn-green { background: #22c55e; color: white; }

        .section-title {
            font-size: 0.9rem;
            font-weight: 600;
            color: #cbd5e1;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
        }

        textarea {
            width: 100%;
            height: 130px;
            background: #090d16;
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 12px;
            color: #f1f5f9;
            font-size: 0.9rem;
            resize: none;
            outline: none;
        }

        textarea:focus {
            border-color: #38bdf8;
        }

        .history-item {
            background: #090d16;
            border: 1px solid #1e293b;
            padding: 10px;
            border-radius: 10px;
            margin-bottom: 8px;
            font-size: 0.85rem;
        }

        .history-date {
            font-size: 0.75rem;
            color: #38bdf8;
            margin-bottom: 4px;
        }
    </style>
</head>
<body>

    <div class="app-header">
        <div class="app-title">
            <span>🎙️</span> VoiceAI Pro
        </div>
        <span style="font-size: 0.75rem; color: #64748b;">Smart Voice Note</span>
    </div>

    <!-- Perekam Suara -->
    <div class="card record-section">
        <button id="btnRecord" class="mic-btn">🎙️</button>
        <div>
            <h3 id="statusTitle" style="font-size: 1.05rem; font-weight: 600;">Ketuk Mikrofon</h3>
            <p id="statusDesc" style="font-size: 0.85rem; color: #94a3b8;">Bicara dan suara akan langsung diubah jadi teks di bawah.</p>
        </div>
    </div>

    <!-- Hasil Transkripsi -->
    <div class="card">
        <div class="section-title">
            <span>📝 Transkripsi Suara</span>
            <span id="charCount" style="color: #64748b;">0 Karakter</span>
        </div>
        <textarea id="rawText" placeholder="Suara Anda akan langsung muncul jadi teks di sini saat berbicara..."></textarea>
    </div>

    <!-- Fitur AI Assistant -->
    <div class="card">
        <div class="section-title">✨ Fitur AI Assistant</div>
        <div class="btn-grid">
            <button id="btnClean" class="btn btn-purple" disabled>🪄 Rapikan Teks</button>
            <button id="btnSummarize" class="btn btn-primary" disabled>📋 Rangkum AI</button>
        </div>
        <button id="btnSave" class="btn btn-green" style="width: 100%; margin-top: 10px;" disabled>💾 Simpan ke Riwayat</button>
    </div>

    <!-- Hasil AI -->
    <div class="card">
        <div class="section-title">🤖 Hasil AI / Rangkuman</div>
        <textarea id="aiResult" placeholder="Hasil pengolahan AI akan ditampilkan di sini..."></textarea>
    </div>

    <!-- Riwayat Catatan -->
    <div class="card">
        <div class="section-title">
            <span>📜 Riwayat Catatan</span>
            <span onclick="clearHistory()" style="color: #f43f5e; cursor: pointer; font-size: 0.8rem;">Hapus Semua</span>
        </div>
        <div id="historyList" style="max-height: 180px; overflow-y: auto; margin-top: 8px;">
            <p style="text-align: center; color: #64748b; font-size: 0.85rem; padding: 10px;">Belum ada riwayat tersimpan.</p>
        </div>
    </div>

    <script>
        let recognition;
        let isRecording = false;
        let accumulatedText = "";
        let historyData = JSON.parse(localStorage.getItem('voice_notes_history_v2') || '[]');

        const btnRecord = document.getElementById('btnRecord');
        const statusTitle = document.getElementById('statusTitle');
        const statusDesc = document.getElementById('statusDesc');
        const rawText = document.getElementById('rawText');
        const aiResult = document.getElementById('aiResult');
        const charCount = document.getElementById('charCount');
        const btnClean = document.getElementById('btnClean');
        const btnSummarize = document.getElementById('btnSummarize');
        const btnSave = document.getElementById('btnSave');
        const historyList = document.getElementById('historyList');

        renderHistory();

        // Inisialisasi Pengenal Suara (Speech Recognition)
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

        if (SpeechRecognition) {
            setupRecognition();
        } else {
            alert("Browser HP Anda tidak mendukung pengenal suara langsung. Harap gunakan Google Chrome!");
        }

        function setupRecognition() {
            recognition = new SpeechRecognition();
            recognition.continuous = true;
            recognition.interimResults = true;
            recognition.lang = 'id-ID';

            recognition.onstart = () => {
                isRecording = true;
                btnRecord.classList.add('recording');
                btnRecord.innerText = '⏹️';
                statusTitle.innerText = "Sedang Merekam...";
                statusDesc.innerText = "Silakan bicara, suara langsung dikonversi menjadi teks.";
            };

            recognition.onresult = (event) => {
                let interimTranscript = '';
                for (let i = event.resultIndex; i < event.results.length; i++) {
                    const transcript = event.results[i][0].transcript;
                    if (event.results[i].isFinal) {
                        accumulatedText += transcript + ' ';
                    } else {
                        interimTranscript += transcript;
                    }
                }
                rawText.value = (accumulatedText + interimTranscript).trim();
                updateState();
            };

            recognition.onerror = (event) => {
                console.log("Speech Recognition Error: ", event.error);
                if (event.error !== 'no-speech') {
                    statusDesc.innerText = "Peringatan: " + event.error;
                }
            };

            recognition.onend = () => {
                if (isRecording) {
                    // Jika masih dalam status merekam, jalankan kembali agar tidak terputus di HP
                    try { recognition.start(); } catch(e){}
                } else {
                    stopUI();
                }
            };
        }

        function stopUI() {
            isRecording = false;
            btnRecord.classList.remove('recording');
            btnRecord.innerText = '🎙️';
            statusTitle.innerText = "Selesai Merekam";
            statusDesc.innerText = "Ketuk mikrofon lagi untuk menambah rekaman suara.";
        }

        // Tombol Merekam
        btnRecord.addEventListener('click', () => {
            if (!recognition) return;

            if (!isRecording) {
                accumulatedText = rawText.value ? rawText.value + ' ' : '';
                try {
                    recognition.start();
                } catch(e) {
                    setupRecognition();
                    recognition.start();
                }
            } else {
                isRecording = false;
                recognition.stop();
                stopUI();
            }
        });

        function updateState() {
            const len = rawText.value.trim().length;
            charCount.innerText = `${len} Karakter`;
            btnClean.disabled = len === 0;
            btnSummarize.disabled = len === 0;
            btnSave.disabled = len === 0;
        }

        rawText.addEventListener('input', updateState);

        // Fitur AI 1: Merapikan Teks
        btnClean.addEventListener('click', () => {
            let text = rawText.value.trim();
            if (!text) return;

            // Hapus kata jeda (filler words)
            text = text.replace(/\b(eee|eee|anu|mmm|umpamanya|apa namanye|apa ya)\b/gi, '');
            text = text.replace(/\s+/g, ' ').trim();
            // Perbaiki huruf kapital diawal kalimat
            text = text.replace(/(^\w|\.\s+\w)/g, letter => letter.toUpperCase());

            aiResult.value = "✨ [Teks Dirapikan AI]:\n\n" + text;
        });

        // Fitur AI 2: Merangkum Teks
        btnSummarize.addEventListener('click', () => {
            let text = rawText.value.trim();
            if (!text) return;

            const sentences = text.split(/[.!?]+/).map(s => s.trim()).filter(s => s.length > 0);
            let summary = "📝 [Rangkuman Poin Utama AI]:\n\n";

            if (sentences.length <= 2) {
                summary += "• " + text;
            } else {
                summary += "• " + sentences[0] + ".\n";
                summary += "• " + sentences[Math.floor(sentences.length / 2)] + ".\n";
                summary += "• " + sentences[sentences.length - 1] + ".";
            }

            aiResult.value = summary;
        });

        // Simpan ke Riwayat HP
        btnSave.addEventListener('click', () => {
            const item = {
                id: Date.now(),
                date: new Date().toLocaleString('id-ID'),
                raw: rawText.value,
                ai: aiResult.value
            };

            historyData.unshift(item);
            localStorage.setItem('voice_notes_history_v2', JSON.stringify(historyData));
            renderHistory();
            alert("Berhasil disimpan ke riwayat!");
        });

        function renderHistory() {
            if (historyData.length === 0) {
                historyList.innerHTML = '<p style="text-align: center; color: #64748b; font-size: 0.85rem; padding: 10px;">Belum ada riwayat tersimpan.</p>';
                return;
            }

            historyList.innerHTML = historyData.map(item => `
                <div class="history-item">
                    <div class="history-date">📅 ${item.date}</div>
                    <div style="color:#cbd5e1;"><strong>Suara:</strong> ${item.raw}</div>
                    ${item.ai ? `<div style="color:#a855f7; margin-top:4px;">${item.ai.replace(/\n/g, '<br>')}</div>` : ''}
                </div>
            `).join('');
        }

        function clearHistory() {
            if (confirm("Hapus seluruh riwayat rekaman?")) {
                historyData = [];
                localStorage.removeItem('voice_notes_history_v2');
                renderHistory();
            }
        }
    </script>
</body>
</html>
